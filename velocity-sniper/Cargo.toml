[package]
name = "velocity-sniper"
version = "0.1.0"
edition = "2021"
description = "Solana ShredStream listener that detects Raydium migration events and executes atomic Jito bundles"
authors = ["Velocity Sniper Dev"]

[dependencies]
# Solana Core
solana-client = "2.0"
solana-sdk = "2.0"
solana-transaction-status = "2.0"
solana-account-decoder = "2.0"
spl-token = "6.0"
spl-associated-token-account = "5.0"

# Async Runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
flume = "0.11"
lazy_static = "1.4"
ahash = "0.8"
core_affinity = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
borsh = "1.0"
bs58 = "0.5"
bytemuck = { version = "1", features = ["derive"] }

# Network (UDP ShredStream)
socket2 = "0.5"
tokio-util = { version = "0.7", features = ["codec", "net"] }
bytes = "1"

# HTTP Client (Jito API, on-chain RPC)
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
dotenvy = "0.15"
toml = "0.8"

# Math & Data Structures
dashmap = "6"
indexmap = "2"
rust_decimal = { version = "1", features = ["maths"] }
num-traits = "0.2"

# Error Handling
anyhow = "1"
thiserror = "2"

# Cryptography
rand = "0.8"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
