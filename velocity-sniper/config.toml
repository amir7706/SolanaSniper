# ═══════════════════════════════════════════════════════════════════════
# VELOCITY SNIPER — Configuration
# ═══════════════════════════════════════════════════════════════════════
# Deploy to: Hetzner Frankfurt VPS (fsn1-dc14 recommended)
# OS: Ubuntu 24.04 LTS
# Monthly cost: ~€7/month (CX22 instance)
#
# USAGE: Copy this file as config.toml and fill in the values.
#        Set PRIVATE_KEY env var or fill trading.private_key_bs58.
# ═══════════════════════════════════════════════════════════════════════

[rpc]
# LOCAL TESTING - Use local test validator
endpoint = "http://127.0.0.1:8899"
ws_endpoint = "ws://127.0.0.1:8900"
# Premium endpoint for faster confirmation checks (same as main)
premium_endpoint = "http://127.0.0.1:8899"

[jito]
# For local testing, Jito is not needed - use placeholder
# For mainnet use: https://frankfurt.mainnet.block-engine.jito.wtf
block_engine_url = "http://127.0.0.1:8899"

# Jito tip accounts — rotates for load distribution
tip_accounts = [
    "96g9sAg9u3mBsJqc9GpaTE9UAiCvt8axvvbdDzzb19oX",
    "HFqU5x63VTqvQss8hp11i4bVqkfRtQ7NmXwkiNPLNiVZ",
    "Cw8CFFL1pYvXqM8D2bdTsF6CaWoGh5Hq2Aw6hZduW9Pz",
    "ADaUMid9yfUytqMBzhZkv6iAsvS6VOXwh6u399qWvP9B",
    "DfXygSm4jCyvG8UMEXrS8cmcyW4PrBnZXCgp2nUno5xr",
    "ADuTqJa3QRWgnstH7L8AnvPy6328abBnAVEZaPkgn4e5",
    "3AV79MJs1GrvCthnuS2SeS2Yy87z6S3fC97SjEGoVjGZ",
    "DttWaMuVvSxrG9f7PQuR8mNoK8yqDdQoN98BqZf3j94P",
]

# Tip amount per bundle (in lamports, 1 SOL = 1,000,000,000)
# Higher tip = higher priority for block inclusion
# Minimum recommended: 100_000 (0.0001 SOL)
tip_lamports = 100_000

# Simulation timeout in milliseconds (Jito block engine simulation)
simulation_timeout_ms = 5000

[shredstream]
# NOTE: For LOCAL TESTING, Jito ShredStream doesn't exist
# The bot will not receive transactions on local test validator
# For mainnet use real proxy addresses
bind_address = "0.0.0.0:0"

# Dummy proxy for local testing - won't receive real data
proxy_address = "127.0.0.1:10000"

# Smaller buffer for local testing
recv_buffer_size = 1_000_000

# Number of worker threads for processing parsed transactions
worker_threads = 1

[trading]
# ⚠️ FILL IN YOUR WALLET PRIVATE KEY (base58 encoded)
# This is the ONLY wallet that will sign and pay for transactions.
# NEVER share this key. NEVER commit it to git.
private_key_bs58 ="yafN4yS69wRtJLHHSee7zqkX7chLN7CC6axuyEPAmhCnRYMuNovC6nfkLRoSahv432c2j3ggyKf5FicGZcGps1c"

# Maximum SOL to spend per single trade
max_sol_per_trade = 0.8

# Take profit: sell at +15% gain
take_profit_pct = 0.15

# Stop loss: sell at -5% loss
stop_loss_pct = 0.05

# Maximum allowed slippage for swaps (30% = high, needed for low-liquidity pools)
max_slippage_pct = 0.30

# Maximum time to hold a position before force-selling (seconds)
max_hold_seconds = 300

# Minimum pool liquidity in SOL to even consider trading
min_pool_liquidity_sol = 50.0

# Priority fee in lamports (added for 2026 performance)
# Higher fee = faster block inclusion. Recommended: 10_000 - 50_000
priority_fee_lamports = 25_000

[safety]
# MANDATORY: Mint authority must be disabled (no infinite supply)
require_mint_authority_disabled = true

# MANDATORY: LP tokens must be burned (liquidity locked)
require_lp_burned = true

# Maximum % a single holder can own (15%)
max_single_holder_pct = 0.15

# Maximum % the top 10 holders can own combined (40%)
max_top10_holders_pct = 0.40

# MANDATORY: Freeze authority must be disabled
require_freeze_authority_disabled = true

# Minimum number of unique token holders
min_unique_holders = 20

[strategy]
# ═══════════════════════════════════════════════════════════════════
# THE 90% WIN RATE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════

# Stage 1: Wait 120 seconds after pool init before even considering a buy.
# This avoids "The War Zone" where gRPC bots fight in the first 60 seconds.
war_zone_wait_seconds = 120

# Stage 2: TPM must INCREASE by at least 20% between minute 1 and minute 2.
# This confirms genuine retail momentum (not a bot dump).
min_tpm_increase_pct = 0.20

# Stage 2: Minimum number of transactions in minute 2 to qualify.
# Filters out dead pools that got a few initial trades and died.
min_minute2_transactions = 30

# Stage 3: Delay between trigger and execution (ms)
# 0ms = immediate, higher = more confirmation but less entry price
execution_delay_ms = 0

# Maximum concurrent open positions
max_concurrent_positions = 3

# Cooldown between trades (seconds) — prevents over-trading
trade_cooldown_seconds = 60

[logging]
log_level = "info"
json_logs = true
log_file = "/var/log/velocity-sniper/sniper.log"
